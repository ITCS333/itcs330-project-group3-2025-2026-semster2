<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Resources</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <script src="admin.js" defer></script>
</head>
<body>

    <header>
        <h1>Manage Course Resources</h1>
    </header>

    <main>
        <!-- Section 1: Add/Edit Resource Form -->
        <section>
            <h2 id="form-heading">Add a New Resource</h2>

            <form id="resource-form" action="#">
                <fieldset>
                    <legend>Resource Details</legend>

                    <label for="resource-title">Title:</label>
                    <input id="resource-title" type="text" required>

                    <label for="resource-description">Description:</label>
                    <textarea id="resource-description"></textarea>
                    
                    <label for="resource-link">Link (URL):</label>
                    <input id="resource-link" type="url" required>

                    <button id="add-resource" type="submit">Add Resource</button>
                </fieldset>
            </form>
        </section>

        <!-- Section 2: Existing Resources List -->
        <section>
            <h2>Existing Resources</h2>

            <table id="resources-table" border="1">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Link</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="resources-tbody">
                    <!-- Resource rows will be injected here dynamically by admin.js -->
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
