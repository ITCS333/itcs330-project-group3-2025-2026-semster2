<!--
  Requirement: Create the Admin View for Assignments

  Instructions:
  Fill in the HTML elements as described in the comments.
  This page allows the teacher (admin) to perform full CRUD operations
  on course assignments.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- TODO: Add the <meta> tag for character encoding (UTF-8). -->
      <meta charset="UTF-8">
    <!-- TODO: Add the responsive viewport <meta> tag
         (width=device-width, initial-scale=1.0). -->
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- TODO: Add a <title>, e.g., "Manage Assignments". -->
      <title>Manage Assignments</title>
    <!-- TODO: Link to your CSS framework or stylesheet. -->
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Required: link admin.js with defer. -->
    <script src="admin.js" defer></script>
</head>
<body>
    <!-- TODO: Create a <header> containing an <h1> "Manage Assignments". -->
        <header class="bg-dark text-white p-4 mb-4">
    <h1 class="text-center">Manage Assignments</h1>
        </header>
    <!-- TODO: Create the <main> content area. -->
    <main class="container">
        <!-- ============================================================
             Section 1: Add / Edit Assignment Form
             ============================================================ -->
        <!-- TODO: Create a <section> for the form. -->
            <section class="card p-4 mb-4">
            <!-- TODO: Add a sub-heading <h2> "Add a New Assignment". -->
            <h2 class="mb-4">Add a New Assignment</h2>
            <!-- TODO: Create a <form id="assignment-form"> (action can be "#").
                 The id is required by admin.js. -->
            <form id="assignment-form" action ="#">
                <!-- TODO: Use a <fieldset> to group the form controls. -->
                <fieldset>
                    <!-- TODO: Add a <legend>, e.g., "Assignment Details". -->
                      <legend>Assignment Details</legend>
                    <!-- TODO: Add a <label> and <input> for the assignment title.
                         - label for="assignment-title"
                         - input id="assignment-title", type="text", required -->
                      <label for="assignment-title" class="form-label">Assignment title</label>
                      <input id="assignment-title" type="text" class="form-control" required>
                    <!-- TODO: Add a <label> and <textarea> for the description.
                         - label for="assignment-description"
                         - textarea id="assignment-description", rows="5", required
                         - Maps to the description column in the assignments table. -->
                      <label for="assignment-description" class="form-label">Assignment description</label>
                      <textarea id="assignment-description" rows="5" class="form-control" required></textarea>

                    <!-- TODO: Add a <label> and <input> for the due date.
                         - label for="assignment-due-date"
                         - input id="assignment-due-date", type="date", required
                         - Maps to the due_date column in the assignments table. -->
                      <label for="assignment-due-date" class="form-label">Assignment due date</label>
                      <input id="assignment-due-date" type="date" class="form-control" required>
                    <!-- TODO: Add a <label> and <textarea> for attached file URLs
                         (one URL per line).
                         - label for="assignment-files"
                         - textarea id="assignment-files", rows="3"
                         - Maps to the files column (JSON array) in the
                           assignments table. admin.js will split the textarea
                           value on newlines and send it as an array. -->
                      <label for="assignment-files" class="form-label">Assignment files</label>
                      <textarea id="assignment-files" rows="3" class="form-control"></textarea>
                    <!-- TODO: Add a submit <button>.
                         - id="add-assignment", type="submit"
                         - Text: "Add Assignment"
                         - When the form is in edit mode, admin.js will
                           change the button text to "Update Assignment" and
                           store the id being edited in a data attribute. -->
                        <button type="submit" id="add-assignment" class="btn btn-primary">Add Assignment</button>
                <!-- End of <fieldset> -->
                </fieldset>
            <!-- End of <form> -->
              </form>
        <!-- End of form <section> -->
        </section>

        <!-- ============================================================
             Section 2: Existing Assignments Table
             ============================================================ -->
        <!-- TODO: Create a <section> to display the current list of
             assignments. -->
                <section class="card p-4">
            <!-- TODO: Add a sub-heading <h2> "Current Assignments". -->
                        <h2 class="mb-4">Current Assignments</h2>
            <!-- TODO: Create a <table id="assignments-table">. -->
                                <table id="assignments-table" class="table table-bordered table-striped">
                <!-- TODO: Create a <thead> with a <tr> containing <th>
                     elements:
                     - "Title"
                     - "Due Date"
                     - "Description"
                     - "Actions"
                     The columns must match the data rendered by
                     admin.js createAssignmentRow(). -->
                                <thead class="table-dark">
                                        <tr>
                                                <th>Title</th>
                                                <th>Due Date</th>
                                                <th>Description</th>
                                                <th>Actions</th>
                                        </tr>
                                </thead>
                <!-- TODO: Create a <tbody id="assignments-tbody">.
                     The id is required by admin.js so it can inject
                     <tr> rows. admin.js will clear and repopulate this
                     tbody whenever the data changes. -->
                        <tbody id="assignments-tbody">
                        </tbody>
                <!-- admin.js will inject rows here. Each row follows
                     this structure (do NOT hardcode real data):

                <tr>
                    <td>HTML &amp; CSS Portfolio</td>
                    <td>2025-02-15</td>
                    <td>Create a responsive portfolio...</td>
                    <td>
                        <button class="edit-btn"   data-id="1">Edit</button>
                        <button class="delete-btn" data-id="1">Delete</button>
                    </td>
                </tr>

                The data-id attribute holds the integer id from the
                assignments table (primary key). -->

            <!-- End of <table> -->
                                </table>
        <!-- End of list <section> -->
                </section>
    <!-- End of <main> -->
          </main>
</body>
</html>
