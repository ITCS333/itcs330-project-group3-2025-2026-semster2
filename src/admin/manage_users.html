<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #faf8ff;
      --surface: #ffffff;
      --border:  #e8e0f5;
      --accent:  #9b6dff;
      --accent2: #c9a7ff;
      --soft:    #f3eeff;
      --text:    #2d2040;
      --muted:   #8b7aab;
      --error:   #e05c7a;
      --success: #5bb88a;
      --radius:  14px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1.2rem 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      color: var(--accent);
    }

    header a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 600;
      transition: color 0.2s;
    }

    header a:hover { color: var(--accent); }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
      position: relative;
      overflow: hidden;
      box-shadow: 0 2px 16px rgba(155,109,255,0.06);
    }

    section::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 20px 20px 0 0;
    }

    h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
    }

    h3 {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted);
      margin: 1.5rem 0 1rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    fieldset { border: none; padding: 0; display: flex; flex-direction: column; gap: 1rem; }

    legend {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    input, select {
      width: 100%;
      background: var(--soft);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.7rem 1rem;
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(155,109,255,0.12);
      background: #fff;
    }

    button[type="submit"] {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 100px;
      padding: 0.7rem 1.5rem;
      font-family: 'Nunito', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
      align-self: flex-start;
      margin-top: 0.25rem;
    }

    button[type="submit"]:hover { opacity: 0.85; }

    details {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    summary {
      padding: 0.9rem 1.2rem;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.9rem;
      background: var(--soft);
      color: var(--accent);
      list-style: none;
      transition: background 0.2s;
      user-select: none;
    }

    summary:hover { background: #ebe0ff; }
    summary::marker { display: none; }
    details[open] summary { border-bottom: 1px solid var(--border); }
    details form { padding: 1.5rem; }

    #search-input { margin-bottom: 1rem; max-width: 360px; }

    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }

    thead { background: var(--soft); border-bottom: 1px solid var(--border); }

    th {
      padding: 0.75rem 1rem;
      text-align: left;
      font-weight: 700;
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      user-select: none;
      transition: color 0.2s;
    }

    th:hover { color: var(--accent); }

    td { padding: 0.85rem 1rem; border-bottom: 1px solid var(--border); }

    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: rgba(155,109,255,0.04); }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.7rem;
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .badge-admin { background: var(--soft); color: var(--accent); }
    .badge-student { background: #f0edf7; color: var(--muted); }

    .edit-btn, .delete-btn {
      padding: 0.3rem 0.9rem;
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      font-family: 'Nunito', sans-serif;
      transition: opacity 0.2s;
      margin-right: 0.4rem;
    }

    .edit-btn { background: var(--soft); color: var(--accent); }
    .delete-btn { background: rgba(224,92,122,0.1); color: var(--error); }
    .edit-btn:hover, .delete-btn:hover { opacity: 0.75; }

    @media (max-width: 600px) {
      main { padding: 1.5rem 1rem; }
      header { padding: 1rem 1.5rem; }
      table { font-size: 0.8rem; }
      th, td { padding: 0.6rem 0.5rem; }
    }
  </style>
  <script src="manage_users.js" defer></script>
</head>
<body>

  <header>
    <h1>Admin Portal</h1>
    <a href="../../index.html">Back to Home</a>
  </header>

  <main>

    <section>
      <h2>Change Your Password</h2>
      <form action="#" id="password-form">
        <fieldset>
          <legend>Password Update</legend>

          <div>
            <label for="current-password">Current Password</label>
            <input type="password" id="current-password" placeholder="Enter current password" required>
          </div>

          <div>
            <label for="new-password">New Password</label>
            <input type="password" id="new-password" placeholder="At least 8 characters" minlength="8" required>
          </div>

          <div>
            <label for="confirm-password">Confirm New Password</label>
            <input type="password" id="confirm-password" placeholder="Repeat new password" required>
          </div>

          <button type="submit" id="change">Update Password</button>
        </fieldset>
      </form>
    </section>

    <section>
      <h2>Manage Users</h2>

      <details>
        <summary>Add New User</summary>
        <form action="#" id="add-user-form">
          <fieldset>
            <legend>New User Information</legend>

            <div>
              <label for="user-name">Full Name</label>
              <input type="text" id="user-name" placeholder="e.g. Ali Hassan" required>
            </div>

            <div>
              <label for="user-email">Email Address</label>
              <input type="email" id="user-email" placeholder="e.g. 202101234@stu.uob.edu.bh" required>
            </div>

            <div>
              <label for="default-password">Default Password</label>
              <input type="password" id="default-password" placeholder="At least 8 characters" minlength="8" required>
            </div>

            <div>
              <label for="is-admin">Role</label>
              <select id="is-admin">
                <option value="0">Student</option>
                <option value="1">Admin</option>
              </select>
            </div>

            <button type="submit" id="add">Add User</button>
          </fieldset>
        </form>
      </details>

      <h3>Registered Users</h3>

      <input type="text" id="search-input" placeholder="Search by name or email...">

      <table id="user-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Admin</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="user-table-body"></tbody>
      </table>

    </section>

  </main>

</body>
</html>
