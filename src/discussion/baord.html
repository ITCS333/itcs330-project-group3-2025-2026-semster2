<!--
  Requirement: Create the General Discussion Board

  Instructions:
  This page will list all discussion topics and include a form to create a new one.
-->
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Discussion Board</title>

    <link rel="stylesheet" href="../../assets/style.css">

</head>

<body>

    <header>
        <h1>General Discussion Board</h1>
    </header>

    <main>

        <!-- New Topic Section -->
        <section>

            <h2>Start a New Topic</h2>

            <form id="new-topic-form" action="#">

                <fieldset>

                    <legend>New Topic Details</legend>

                    <label for="topic-subject">
                        Topic Subject
                    </label>

                    <input
                        type="text"
                        id="topic-subject"
                        required
                    >

                    <label for="topic-message">
                        Message
                    </label>

                    <textarea
                        id="topic-message"
                        rows="6"
                        required
                    ></textarea>

                    <button
                        id="create-topic"
                        type="submit"
                    >
                        Create Topic
                    </button>

                </fieldset>

            </form>

        </section>

        <!-- Topics Section -->
        <section>

            <h2>All Topics</h2>

            <div id="topics-container">

                <!-- Topic 1 -->
                <article>

                    <h3>
                        <a href="topic.html?id=1">
                            Question about CSS Flexbox
                        </a>
                    </h3>

                    <footer>
                        Posted by: Student Name on 2026-05-21
                    </footer>

                    <div>

                        <button>Edit</button>

                        <button>Delete</button>

                    </div>

                </article>

                <!-- Topic 2 -->
                <article>

                    <h3>
                        <a href="topic.html?id=2">
                            JavaScript Event Problem
                        </a>
                    </h3>

                    <footer>
                        Posted by: Ali Hassan on 2026-05-20
                    </footer>

                    <div>

                        <button>Edit</button>

                        <button>Delete</button>

                    </div>

                </article>

            </div>

        </section>

    </main>

</body>

</html>
