<!--
  Requirement: Create the General Discussion Board

  Instructions:
  This page lists all discussion topics and includes a form to create a new one.
-->
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Discussion Board</title>

    <link rel="stylesheet" href="../../assets/style.css">

    <script src="board.js" defer></script>

</head>

<body>

    <header>

        <h1>
            General Discussion Board
        </h1>

    </header>

    <main>

        <!-- New Topic Section -->
        <section>

            <h2>
                Start a New Topic
            </h2>

            <form id="new-topic-form" action="#">

                <fieldset>

                    <legend>
                        New Topic Details
                    </legend>

                    <label for="topic-subject">
                        Topic Subject
                    </label>

                    <input
                        type="text"
                        id="topic-subject"
                        required
                    >

                    <label for="topic-message">
                        Message
                    </label>

                    <textarea
                        id="topic-message"
                        rows="6"
                        required
                    ></textarea>

                    <button
                        id="create-topic"
                        type="submit"
                    >
                        Create Topic
                    </button>

                </fieldset>

            </form>

        </section>

        <!-- Topics List -->
        <section>

            <h2>
                All Topics
            </h2>

            <div id="topic-list-container">

                <!-- Example Topic -->
                <article>

                    <h3>

                        <a href="topic.html?id=1">
                            Welcome to Web Development!
                        </a>

                    </h3>

                    <footer>
                        Posted by: Course Admin on 2025-01-13
                    </footer>

                    <div>

                        <button
                            class="edit-btn"
                            data-id="1"
                        >
                            Edit
                        </button>

                        <button
                            class="delete-btn"
                            data-id="1"
                        >
                            Delete
                        </button>

                    </div>

                </article>

            </div>

        </section>

    </main>

</body>

</html>
